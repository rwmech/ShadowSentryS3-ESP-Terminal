; ShadowSentry S3 on the Elecrow CrowPanel ESP32 Terminal 3.5" (DLC35020S, V1.0)
; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM, CH340C on USB-C.
;
; V1.0 has no auto-reset circuit: hold BOOT, tap RESET, then `pio run -t upload`.
; Tap RESET again after the upload finishes to start the firmware.

[platformio]
src_dir = main
default_envs = crowpanel35

[env:crowpanel35]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.embed_txtfiles = main/index.html
upload_port = COM43
upload_speed = 921600
upload_flags =
    --before=no_reset
    --after=no_reset
monitor_port = COM43
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
