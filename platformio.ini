; ShadowSentry S3 on the Elecrow CrowPanel ESP32 Terminal 3.5" (DLC35020S, V1.0)
; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM, CH340C on USB-C.
;
; V1.0 has no auto-reset circuit (CH340 DTR/RTS are not wired to EN/IO0): hold
; BOOT, tap RESET, then `pio run -t upload`. esptool leaves via an RTC watchdog
; reset, which needs no DTR/RTS, so the new firmware starts on its own.

[platformio]
src_dir = main
default_envs = crowpanel35

[env:crowpanel35]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; The board (main/board/board.h); a config.h naming another board fails the build
build_src_flags = -DBOARD_CROWPANEL35
; The web pages are embedded gzip-compressed, written to main/gz by the pre: script.
; build_id.py writes main/gz/build_id.h (git short hash, build date) every build.
extra_scripts =
    pre:tools/gzip_assets.py
    pre:tools/build_id.py
board_build.embed_files =
    main/gz/index.html.gz
    main/gz/device.html.gz
    main/gz/analysis.js.gz
    docs/mockups/shadowsentry-logo-200.png
; esptool >= 4.8 for --after=watchdog_reset (the platform's bundled one is older)
platform_packages = platformio/tool-esptoolpy@2.41100.260830
upload_port = COM43
upload_speed = 921600
upload_flags =
    --before=no_reset
    --after=watchdog_reset
monitor_port = COM43
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Over-the-air: `pio run -e crowpanel35_ota -t upload`. Same build; uploads via
; the admin panel's POST /api/ota. Set upload_port to the device's IP or name.
[env:crowpanel35_ota]
extends = env:crowpanel35
upload_protocol = custom
upload_port = 192.168.0.118
upload_command = "$PYTHONEXE" -I "$PROJECT_DIR/tools/ota_upload.py" "$SOURCE" $UPLOAD_PORT

; Waveshare ESP32-S3-Touch-LCD-4.3B (BOARD_WAVESHARE43): the same build with the
; board's pins (main/board/board_waveshare43.h) and its sdkconfig additions
; (sdkconfig.defaults.waveshare43: XIP from PSRAM for the RGB panel, console on
; USB-Serial/JTAG). Flashes over the chip's own USB (one USB-C port), which
; resets into the ROM loader by itself: no BOOT or RESET buttons.
; After editing sdkconfig.defaults.waveshare43, delete sdkconfig.waveshare43*
; and .pio/build/waveshare43* (PlatformIO only watches sdkconfig.defaults).
[env:waveshare43]
extends = env:crowpanel35
build_src_flags = -DBOARD_WAVESHARE43
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.waveshare43
upload_port = COM23
upload_flags =
    --before=default_reset
    --after=hard_reset
monitor_port = COM23

; Over-the-air, as crowpanel35_ota: set upload_port to the board's IP once it
; has joined the network (first flash over USB).
[env:waveshare43_ota]
extends = env:waveshare43
upload_protocol = custom
upload_port = 0.0.0.0
upload_command = "$PYTHONEXE" -I "$PROJECT_DIR/tools/ota_upload.py" "$SOURCE" $UPLOAD_PORT
