; ShadowSentry S3 on the Elecrow CrowPanel ESP32 Terminal 3.5" (DLC35020S, V1.0)
; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM, CH340C on USB-C.
;
; V1.0 has no auto-reset circuit (CH340 DTR/RTS are not wired to EN/IO0): hold
; BOOT, tap RESET, then `pio run -t upload`. esptool leaves via an RTC watchdog
; reset, which needs no DTR/RTS, so the new firmware starts on its own.

[platformio]
src_dir = main
default_envs = crowpanel35

[env:crowpanel35]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; The web pages are embedded gzip-compressed, written to main/gz by the pre: script.
extra_scripts = pre:tools/gzip_assets.py
board_build.embed_files =
    main/gz/index.html.gz
    main/gz/device.html.gz
    main/gz/analysis.js.gz
; esptool >= 4.8 for --after=watchdog_reset (the platform's bundled one is older)
platform_packages = platformio/tool-esptoolpy@2.41100.260830
upload_port = COM43
upload_speed = 921600
upload_flags =
    --before=no_reset
    --after=watchdog_reset
monitor_port = COM43
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Over-the-air: `pio run -e crowpanel35_ota -t upload`. Same build; uploads via
; the admin panel's POST /api/ota. Set upload_port to the device's IP or name.
[env:crowpanel35_ota]
extends = env:crowpanel35
upload_protocol = custom
upload_port = 192.168.0.118
upload_command = "$PYTHONEXE" -I "$PROJECT_DIR/tools/ota_upload.py" "$SOURCE" $UPLOAD_PORT
